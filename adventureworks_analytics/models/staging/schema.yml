version: 2

models:
  - name: stg_customer
    description: "Staged clean customer dimension records sourced from raw_adventureworks.dimcustomer."
    columns:
      - name: customer_key
        description: "The primary key identifying a unique customer record."
        data_tests:
          - unique
          - not_null

      - name: first_name
        data_tests:
          - no_unwanted_spaces

      - name: middle_name
        data_tests:
          - no_unwanted_spaces

      - name: last_name
        data_tests:
          - no_unwanted_spaces

      - name: customer_id
        description: "The business alternative tracking identifier for the customer."
        data_tests:
          - not_null

      - name: email_address
        description: "The validated contact email address of the record."
        data_tests:
          - not_null
          - no_unwanted_spaces

      - name: marital_status
        description: "The expanded marital state description (Married or Single)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Married', 'Single']
          - no_unwanted_spaces

      - name: gender
        description: "The expanded biographical tracking value (Male or Female)."
        data_tests:
          - accepted_values:
              arguments:
                values: ['Male', 'Female']
          - no_unwanted_spaces
  # ========================================================================
  # STG_PRODUCT TESTS
  # ========================================================================
  - name: stg_product
    description: "Staged clean product dimension records sourced from raw_adventureworks.dimproduct."
    columns:
      - name: product_key
        data_tests:
          - unique
          - not_null

      - name: product_name
        description: "Guarantees that no nameless inventory records leak downstream."
        data_tests:
          - not_null 
          - no_unwanted_spaces

      - name: product_line
        description: "Product line category for the item."
        data_tests:
          - no_unwanted_spaces
          - accepted_values:
              arguments:
                values: ['Mountain', 'Road', 'Touring', 'Components', 'Unknown']

      - name: model_name
        description: "Name of the product model associated with the item."
        data_tests:
          - no_unwanted_spaces

  - name: stg_fact_internet_sales
    description: "Internet sales at one row per sales order and line item."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sales_order_number
              - sales_order_line_item
    columns:
      - name: sales_order_number
        data_tests:
          - not_null
      - name: sales_order_line_item
        description: "Source salesorderlinenumber identifying the line within an order."
        data_tests:
          - not_null
      - name: customer_key
        description: "Required customer reference to the staged customer dimension."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customer')
                field: customer_key
