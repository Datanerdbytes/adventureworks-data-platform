version: 2

sources:
  - name: raw_adventureworks
    database: quantum-echo-data-eng-prod     
    schema: raw_adventureworks               
    tables:
      - name: dimcurrency
      # ========================================================================
      # RAW CUSTOMER SOURCE TESTS
      # ========================================================================
      - name: dimcustomer
        description: "Raw landing zone table for customer data."
        columns:
          - name: customerkey
            data_tests:
              - unique
              - not_null
          - name: customeralternatekey
            description: "Alternate business key used to identify the customer in source systems."
            data_tests:
              - not_null

          - name: firstname
            data_tests:
              - no_unwanted_spaces

          - name: middlename
            data_tests:
              - no_unwanted_spaces

          - name: lastname
            data_tests:
              - no_unwanted_spaces

          - name: gender
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['M', 'F', 'm', 'f']
              - no_unwanted_spaces

          - name: emailaddress
            description: "Ensures email communication links are fully present."
            data_tests: 
              - no_unwanted_spaces

          - name: maritalstatus
            description: "Catches dirty or unhandled letters before staging translation."
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['M', 'S', 'm', 's']
              - no_unwanted_spaces

      - name: dimdate
      - name: dimemployee
      - name: dimgeography
      # ========================================================================
      # RAW PRODUCT SOURCE TESTS
      # ========================================================================
      - name: dimproduct
        description: "Raw landing zone table for product data."
        columns:
          - name: productkey
            data_tests:
              - unique 
              - not_null

          - name: englishproductname
            description: "Guarantees that no nameless inventory records leak downstream."
            data_tests:
              - not_null 
              - no_unwanted_spaces

          - name: productline
            description: "Product line category for the item."
            data_tests:
              - no_unwanted_spaces
              - accepted_values:
                  arguments:
                    values: ['M', 'R', 'T', 'S']

          - name: modelname
            description: "Name of the product model associated with the item."
            data_tests:
              - no_unwanted_spaces

      - name: dimproductcategory
      - name: dimproductsubcategory
      - name: dimpromotion
      - name: dimreseller
      - name: dimsalesterritory
      - name: factinternetsales
      - name: factresellersales
