version: 2

models:
  - name: fct_sales
    description: "Consolidated Gold fact table merging Internet and Reseller wholesale revenue streams."
    data_tests:
      # One row per channel, sales order, and line item.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sales_channel
              - sales_order_number
              - sales_order_line_item
      - dbt_utils.expression_is_true:
          arguments:
            expression: >-
              (sales_channel = 'Internet' and customer_key is not null and reseller_key is null)
              or (sales_channel = 'Reseller' and reseller_key is not null and customer_key is null)

    columns:
      - name: sales_order_number
        data_tests:
          - not_null

      - name: sales_order_line_item
        data_tests:
          - not_null

      - name: sales_channel
        description: "Identifies if the row came from the B2C Internet channel or B2B Reseller channel."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Internet', 'Reseller']

      - name: product_key
        description: "Foreign key mapping back to the product catalog dimension."
        data_tests:
          - not_null
          # 🔗 REFERENTIAL INTEGRITY: Guarantees every sold product maps to a valid item
          - relationships:
              arguments:
                to: ref('stg_product')
                field: product_key

      - name: order_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_dim_date')
                field: date_key

      - name: customer_key
        description: "Required for Internet sales; null for Reseller sales, enforced by the model-level test."
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customer')
                field: customer_key

      - name: reseller_key
        description: "Required for Reseller sales; null for Internet sales, enforced by the model-level test."
        data_tests:
          - relationships:
              arguments:
                to: source('raw_adventureworks', 'dimreseller')
                field: resellerkey

      - name: order_quantity
        data_tests:
          - not_null

      - name: sales_amount
        description: "The gross revenue generated by the line item transaction."
        data_tests:
          - not_null

      - name: total_product_cost
        data_tests:
          - not_null

      - name: gross_profit_amount
        data_tests:
          - not_null

  - name: dim_customer
    description: One row per staged customer, enriched with raw geography. Required
      identity and geographic fields must be populated; optional titles and middle names
      may be null.
    data_tests:
    - not_empty
    - dbt_utils.equal_rowcount:
        arguments:
          compare_model: ref('stg_customer')
    - dbt_utils.expression_is_true:
        name: dim_customer_valid_birth_date
        arguments:
          expression: birth_date <= current_date()
    - dbt_utils.expression_is_true:
        name: dim_customer_valid_purchase_date
        arguments:
          expression: date_first_purchase >= birth_date and date_first_purchase <= current_date()
    - dbt_utils.expression_is_true:
        name: dim_customer_valid_income
        arguments:
          expression: yearly_income >= 0 and not is_nan(yearly_income) and not is_inf(yearly_income)
    - dbt_utils.expression_is_true:
        name: dim_customer_valid_child_counts
        arguments:
          expression: total_children >= 0 and children_at_home >= 0
    # Preserve reported counts; inconsistent totals require review, not an inferred correction.
    - dbt_utils.expression_is_true:
        name: dim_customer_child_counts_consistent
        arguments:
          expression: children_at_home <= total_children
        config:
          severity: warn
    - dbt_utils.expression_is_true:
        name: dim_customer_valid_email
        arguments:
          expression: regexp_contains(email_address, r'^[^\s@]+@[^\s@]+\.[^\s@]+$')
    columns:
    - name: customer_key
      data_tests:
      - not_null
      - unique
      - relationships:
          arguments:
            to: ref('stg_customer')
            field: customer_key
    - name: customer_id
      data_tests:
      - not_null
      - unique
      - no_unwanted_spaces
      - dbt_utils.expression_is_true:
          arguments:
            expression: '!= '''''
    - name: first_name
      data_tests:
      - not_null
      - no_unwanted_spaces
      - dbt_utils.expression_is_true:
          arguments:
            expression: '!= '''''
    - name: last_name
      data_tests:
      - not_null
      - no_unwanted_spaces
      - dbt_utils.expression_is_true:
          arguments:
            expression: '!= '''''
    - name: full_name
      data_tests:
      - not_null
      - no_unwanted_spaces
      - dbt_utils.expression_is_true:
          arguments:
            expression: '!= '''''
    - name: email_address
      data_tests:
      - not_null
      - no_unwanted_spaces
      - dbt_utils.expression_is_true:
          arguments:
            expression: '!= '''''
    - name: birth_date
      data_tests:
      - not_null
    - name: date_first_purchase
      data_tests:
      - not_null
    - name: yearly_income
      data_tests:
      - not_null
    - name: total_children
      data_tests:
      - not_null
    - name: children_at_home
      data_tests:
      - not_null
    - name: city
      data_tests:
      - not_null
      - no_unwanted_spaces
      - dbt_utils.expression_is_true:
          arguments:
            expression: '!= '''''
    - name: state_province_name
      data_tests:
      - not_null
      - no_unwanted_spaces
      - dbt_utils.expression_is_true:
          arguments:
            expression: '!= '''''
    - name: country_region_name
      data_tests:
      - not_null
      - no_unwanted_spaces
      - dbt_utils.expression_is_true:
          arguments:
            expression: '!= '''''
    - name: postal_code
      data_tests:
      - not_null
      - no_unwanted_spaces
      - dbt_utils.expression_is_true:
          arguments:
            expression: '!= '''''
    - name: gender
      description: Null is allowed when the source status is unknown.
      data_tests:
      - accepted_values:
          arguments:
            values:
            - Male
            - Female
    - name: marital_status
      description: Null is allowed when the source status is unknown.
      data_tests:
      - accepted_values:
          arguments:
            values:
            - Married
            - Single

  - name: dim_product
    description: Finished goods at one row per product_key, retaining historical versions.
      product_id may repeat across versions; an open-ended valid_to_date may be null.
    data_tests:
    - not_empty
    - finished_product_coverage
    - product_version_date_boundaries
    - dbt_utils.unique_combination_of_columns:
        arguments:
          combination_of_columns:
          - product_id
          - valid_from_date
    - dbt_utils.expression_is_true:
        name: dim_product_valid_dates
        arguments:
          expression: valid_to_date is null or valid_to_date >= valid_from_date
    - dbt_utils.expression_is_true:
        name: dim_product_valid_financial_values
        arguments:
          expression: standard_cost >= 0 and list_price >= 0 and not is_nan(standard_cost)
            and not is_inf(standard_cost) and not is_nan(list_price) and not is_inf(list_price)
    - dbt_utils.expression_is_true:
        name: dim_product_valid_markup
        arguments:
          expression: abs(markup_amount - (list_price - standard_cost)) <= 0.000001
    - dbt_utils.expression_is_true:
        name: dim_product_nonnegative_markup
        arguments:
          expression: list_price >= standard_cost
        config:
          severity: warn
    columns:
    - name: product_key
      data_tests:
      - not_null
      - unique
      - relationships:
          arguments:
            to: ref('stg_product')
            field: product_key
    - name: product_id
      data_tests:
      - not_null
      - no_unwanted_spaces
      - dbt_utils.expression_is_true:
          arguments:
            expression: '!= '''''
    - name: product_name
      data_tests:
      - not_null
      - no_unwanted_spaces
      - dbt_utils.expression_is_true:
          arguments:
            expression: '!= '''''
    - name: color
      data_tests:
      - not_null
      - no_unwanted_spaces
      - dbt_utils.expression_is_true:
          arguments:
            expression: '!= '''''
    - name: size
      data_tests:
      - not_null
      - no_unwanted_spaces
      - dbt_utils.expression_is_true:
          arguments:
            expression: '!= '''''
    - name: subcategory_name
      data_tests:
      - not_null
      - no_unwanted_spaces
      - dbt_utils.expression_is_true:
          arguments:
            expression: '!= '''''
      - relationships:
          arguments:
            to: source('raw_adventureworks', 'dimproductsubcategory')
            field: englishproductsubcategoryname
    - name: category_name
      data_tests:
      - not_null
      - no_unwanted_spaces
      - dbt_utils.expression_is_true:
          arguments:
            expression: '!= '''''
      - relationships:
          arguments:
            to: source('raw_adventureworks', 'dimproductcategory')
            field: englishproductcategoryname
    - name: standard_cost
      data_tests:
      - not_null:
          config:
            severity: warn
    - name: list_price
      data_tests:
      - not_null:
          config:
            severity: warn
    - name: markup_amount
      data_tests:
      - not_null:
          config:
            severity: warn
    - name: valid_from_date
      data_tests:
      - not_null
    - name: product_line
      data_tests:
      - not_null
      - accepted_values:
          arguments:
            values:
            - Mountain
            - Road
            - Touring
            - Components
            - Unknown
    - name: class
      data_tests:
      - not_null
      - accepted_values:
          arguments:
            values:
            - Low
            - Medium
            - High
            - Unknown
    - name: style
      data_tests:
      - not_null
      - accepted_values:
          arguments:
            values:
            - Universal
            - Women
            - Men
            - Unknown
    - name: valid_to_date
      description: Inclusive end date, one day before the next version's start within product_id. Null for the last version.
    - name: current_status
      description: Preserved source status; null is allowed for historical versions.

  - name: dim_date
    description: "One row per calendar day, preserving the complete staged date range. Sunday is day 1; week 1 contains January 1."
    data_tests:
      - not_empty
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_dim_date')
      - mart_date_attributes
    columns:
      - name: date_key
        description: "Unique YYYYMMDD integer identifying the calendar date."
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_dim_date')
                field: date_key
      - name: calendar_date
        description: "Unique calendar day; dates must be consecutive across the staged range."
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_dim_date')
                field: calendar_date
          - date_continuity

  - name: dim_reseller
    description: One row per reseller, preserving raw corporate attributes and the geography
      associated with its source geography key.
    data_tests:
    - not_empty
    - dbt_utils.equal_rowcount:
        arguments:
          compare_model: source('raw_adventureworks', 'dimreseller')
    - reseller_source_alignment
    - dbt_utils.expression_is_true:
        name: dim_reseller_valid_revenue
        arguments:
          expression: annual_revenue >= 0 and not is_nan(annual_revenue) and not is_inf(annual_revenue)
    - dbt_utils.expression_is_true:
        name: dim_reseller_valid_employee_count
        arguments:
          expression: number_of_employees >= 0
    - dbt_utils.expression_is_true:
        name: dim_reseller_valid_opening_year
        arguments:
          expression: year_opened between 1 and extract(year from current_date())
    columns:
    - name: reseller_key
      data_tests:
      - not_null
      - unique
      - relationships:
          arguments:
            to: source('raw_adventureworks', 'dimreseller')
            field: resellerkey
    - name: reseller_id
      data_tests:
      - not_null
      - unique
      - no_unwanted_spaces
      - dbt_utils.expression_is_true:
          arguments:
            expression: '!= '''''
    - name: reseller_name
      data_tests:
      - not_null
      - no_unwanted_spaces
      - dbt_utils.expression_is_true:
          arguments:
            expression: '!= '''''
    - name: order_frequency
      data_tests:
      - not_null
      - no_unwanted_spaces
      - dbt_utils.expression_is_true:
          arguments:
            expression: '!= '''''
      - accepted_values:
          arguments:
            values:
            - A
            - Q
            - S
    - name: number_of_employees
      data_tests:
      - not_null
    - name: annual_revenue
      data_tests:
      - not_null
    - name: product_line
      data_tests:
      - not_null
      - no_unwanted_spaces
      - dbt_utils.expression_is_true:
          arguments:
            expression: '!= '''''
    - name: year_opened
      data_tests:
      - not_null
    - name: city
      data_tests:
      - not_null
      - no_unwanted_spaces
      - dbt_utils.expression_is_true:
          arguments:
            expression: '!= '''''
    - name: state_province_name
      data_tests:
      - not_null
      - no_unwanted_spaces
      - dbt_utils.expression_is_true:
          arguments:
            expression: '!= '''''
    - name: country_region_name
      data_tests:
      - not_null
      - no_unwanted_spaces
      - dbt_utils.expression_is_true:
          arguments:
            expression: '!= '''''
    - name: postal_code
      data_tests:
      - not_null
      - no_unwanted_spaces
      - dbt_utils.expression_is_true:
          arguments:
            expression: '!= '''''

  - name: dim_sales_territory
    description: One row per source territory, including the NA placeholder (key 11,
      business ID 0). The placeholder is retained for source coverage but fails the
      strict corporate-group accepted-values rule.
    data_tests:
    - not_empty
    - dbt_utils.equal_rowcount:
        arguments:
          compare_model: source('raw_adventureworks', 'dimsalesterritory')
    - territory_source_alignment
    - territory_country_group_consistency
    - dbt_utils.unique_combination_of_columns:
        arguments:
          combination_of_columns:
          - territory_country
          - territory_region
    columns:
    - name: sales_territory_key
      data_tests:
      - not_null
      - unique
      - relationships:
          arguments:
            to: source('raw_adventureworks', 'dimsalesterritory')
            field: salesterritorykey
    - name: sales_territory_id
      data_tests:
      - not_null
      - unique
    - name: territory_region
      data_tests:
      - not_null
      - no_unwanted_spaces
      - dbt_utils.expression_is_true:
          arguments:
            expression: '!= '''''
    - name: territory_country
      data_tests:
      - not_null
      - no_unwanted_spaces
      - dbt_utils.expression_is_true:
          arguments:
            expression: '!= '''''
    - name: territory_group
      data_tests:
      - not_null
      - no_unwanted_spaces
      - dbt_utils.expression_is_true:
          arguments:
            expression: '!= '''''
      - accepted_values:
          arguments:
            values: &id001
            - North America
            - Europe
            - Pacific
          config:
            severity: warn
      - required_values_present:
          arguments:
            values: *id001
