name: Dependency Audit

on:
  pull_request:
    branches:
      - integration
      - main
  push:
    branches:
      - integration
      - main
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Export locked production dependencies
        run: uv export --frozen --no-dev --format=requirements.txt --output-file requirements.lock.txt

      - name: Run pip-audit against locked dependencies
        run: uv run --python 3.12 pip-audit --requirement requirements.lock.txt --strict
