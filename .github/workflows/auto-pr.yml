name: Pull Request Link

on:
  push:
    branches-ignore:
      - main
      - master

permissions: {}

jobs:
  pr-link:
    runs-on: ubuntu-latest
    steps:
      - name: Provide a user-authored pull request link
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import quote

          branch = quote(os.environ["SOURCE_BRANCH"], safe="")
          repository = os.environ["GITHUB_REPOSITORY"]
          server = os.environ["GITHUB_SERVER_URL"]
          url = f"{server}/{repository}/compare/main...{branch}?expand=1"
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "## Open a pull request\n\n"
              f"[Create or view a pull request into main]({url})\n\n"
              "Open the link while signed in to GitHub and submit the PR as your "
              "account. This workflow does not create a bot-authored PR or need "
              "a token. Existing pull requests appear on the compare page.\n",
              encoding="utf-8",
          )
          PY
