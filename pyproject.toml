[project]
name = "postgres-adventureworksdw"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dash==3.4.0",
    "dash-ag-grid==33.3.3",
    "dash-bootstrap-components==2.0.4",
    "duckdb>=2.0.0",
    "flask-caching==2.5.1",
    "gunicorn==23.0.0",
    "pandas==3.0.6",
    "plotly==6.9.0",
    "pyarrow==25.0.1",
    "python-dotenv==1.2.4",
]

[dependency-groups]
# Offline warehouse pipeline (dbt + BigQuery/Postgres clients). Never imported
# by the served Dash app; kept out of the container image via
# `uv sync --no-group warehouse` and included locally through dev.
warehouse = [
    "dbt==2.0.6",
    "dbt-bigquery==1.12.1",
    "dbt-core==1.12.5",
    "google-cloud-bigquery==3.45.2",
    "google-cloud-bigquery-storage==2.41.0",
    "pandas-gbq==0.35.2",
    "psycopg2-binary==2.9.13",
    "sqlalchemy==2.1.1",
    "sqlalchemy-bigquery==1.17.2",
]
dev = [
    {include-group = "warehouse"},
    "bandit==1.9.4",
    "black==26.10.1",
    "dbt-duckdb>=1.11.1",
    "detect-secrets==1.5.0",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pre-commit==4.7.0",
    "pre-commit-hooks==6.0.0",
    "ruff==0.17.0",
]

[tool.black]
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".kilo", "adventureworks_analytics/target", "adventureworks_analytics/dbt_packages"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
explicit_package_bases = true
mypy_path = ["my-dash-app", "."]
check_untyped_defs = true
warn_unused_ignores = true
